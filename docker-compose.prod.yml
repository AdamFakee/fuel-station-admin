services:
  postgres:
    image: postgres:16-alpine
    container_name: fuel_station_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fuel_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chưa được đặt}
      POSTGRES_DB: ${POSTGRES_DB:-fuel_station_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - internal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fuel_admin} -d ${POSTGRES_DB:-fuel_station_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${DOCKER_USERNAME}/fuel-station-backend:latest
    container_name: fuel_station_backend_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-fuel_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fuel_station_db}?sslmode=disable
      DB_MAX_CONNS: ${DB_MAX_CONNS:-50}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS chưa được đặt}
      DEVICE_CRYPTO_KEY: ${DEVICE_CRYPTO_KEY:?DEVICE_CRYPTO_KEY chưa được đặt}
      STORAGE_DIR: /app/uploads
      EDGE_HEARTBEAT_THRESHOLD_SECONDS: ${EDGE_HEARTBEAT_THRESHOLD_SECONDS:-300}
    volumes:
      - uploads_prod_data:/app/uploads
    networks:
      - internal_network
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  admin:
    image: ${DOCKER_USERNAME}/fuel-station-admin:latest
    container_name: fuel_station_admin_prod
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - internal_network
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

networks:
  internal_network:
    driver: bridge

volumes:
  postgres_prod_data:
    name: fuel_station_postgres_prod_data
  uploads_prod_data:
    name: fuel_station_uploads_prod_data
