version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fuel_station_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fuel_station_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fuel_station_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fuel_station_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/fuel_station_db?sslmode=disable"
      DB_MAX_CONNS: 20
    ports:
      - "8080:8080"

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: fuel_station_admin
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080/v1"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
